<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Glorp</title>
  <!-- Body: a triangle whose corners are rounded by a thick round-joined stroke -->
  <path d="M32 10 L56 52 L8 52 Z" fill="#1f6b2c" stroke="#1f6b2c" stroke-width="14" stroke-linejoin="round"/>
  <path d="M32 10 L56 52 L8 52 Z" fill="#43c252" stroke="#43c252" stroke-width="9" stroke-linejoin="round"/>
  <!-- One eye -->
  <circle cx="32" cy="35" r="11.5" fill="#ffffff" stroke="#1f6b2c" stroke-width="2"/>
  <circle cx="33.6" cy="36" r="5.4" fill="#13261a"/>
  <circle cx="35.6" cy="34" r="1.8" fill="#ffffff"/>
  <!-- Small grin -->
  <path d="M26 50 Q32 54 38 50" fill="none" stroke="#1f6b2c" stroke-width="2.2" stroke-linecap="round"/>
</svg>
